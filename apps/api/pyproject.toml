[project]
name = "ace-api"
version = "0.1.0"
description = "Ace — agentic exam-prep backend (FastAPI + Postgres/pgvector)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "pymupdf>=1.24",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[project.scripts]
ace = "ace_api.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ace_api"]
